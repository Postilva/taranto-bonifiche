<body class="mappa">

<header class="topbar">
  <div class="in">

      <a href="index.html">Inizio</a>
      <a href="mappa.html" aria-current="page">Mappa</a>
    </nav>

<div class="mapwrap">
  <div id="map" role="region" aria-label="Mappa di Taranto con gli interventi"></div>

  <aside class="panel" id="panel" aria-label="Elenco e filtri">
    <div class="ph">
      <h1><span class="n-tot">35</span> interventi</h1>
      <button type="button" class="close" id="panel-close" aria-label="Chiudi l'elenco">✕</button>
      <p id="intro">Tocca un punto per leggere il report; avvicinati per leggere i codici.</p>
      <div class="seg" role="radiogroup" aria-label="Colori e filtri per">
        <button type="button" role="radio" data-c="fase" aria-checked="true">Fase</button>
        <button type="button" role="radio" data-c="gruppo" aria-checked="false">Gruppo</button>
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filtri"></div>
      <input id="q" class="search" type="search" placeholder="Cerca: Mar Piccolo, A15, Statte…" aria-label="Cerca un intervento">
      <p class="lcount"><span id="lcount"></span> · <button type="button" class="linkbtn" id="fuori-open" aria-haspopup="dialog">Cosa non è sulla mappa?</button></p>
    </div>
    <ul class="list" id="list"></ul>
  </aside>
  <button type="button" class="paneltoggle" id="panel-open">☰ Elenco e filtri</button>

  <details class="legend-map" id="legenda">
    <summary><span>Colori: <span id="lg-modo">fase</span></span></summary>
    <div class="lg-in">
      <ul class="lg-voci" id="lg-voci"></ul>
      <p class="lg-x"><i class="sw bordo"></i>bordo pieno: posizione da documento ufficiale</p>
    </div>
  </details>
</div>

<dialog id="fuori-dlg" aria-labelledby="fuori-t">
  <button type="button" class="x" id="fuori-close" aria-label="Chiudi">✕</button>
  <h2 id="fuori-t">Cosa non è sulla mappa</h2>
  <div id="fuori"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="dati.js?v=202610231400"></script>
<script src="comune.js?v=202610231400"></script>
<script>
/* Mappa a schermo intero. mappa.html#<codice> apre la mappa con quel pallino selezionato (es. dal "Torna alla mappa" del report). */
document.querySelectorAll(".n-tot").forEach(el => el.textContent = TOTAL);
const panelOpen = () => !document.body.classList.contains("panel-off");
const panelW = () => panelOpen() && !isNarrow() ? $("#panel").offsetWidth + 24 : 0;
function setPanel(on){ document.body.classList.toggle("panel-off", !on); setTimeout(placePv, 220); }
$("#panel-close").addEventListener("click", () => setPanel(false));
$("#panel-open").addEventListener("click", () => setPanel(true));
if (isNarrow()) setPanel(false);   // telefono: si parte dalla mappa, l'elenco si apre col bottone

let map, markers = {}, selected = null, pv, pvLL = null;
const pinOf = c => markers[c]?.getElement()?.querySelector(".pin");
/* colori e filtri: per fase (gli stessi colori della barra delle tappe) o per gruppo (arancione e azzurro). Si ricorda la scelta. */
// le fasi di FASI in quattro colori: [chiave, nome (legenda), fasi, nome corto (filtri)]
const TAPPE = [
  ["dafare",  "Analisi da fare",             ["dafare"],                      "Da analizzare"],
  ["analisi", "Analizzata, non bonificata",  ["analisi", "rischio", "mis"],   "Analizzata"],
  ["fatto",   "Bonificata o non necessaria", ["nonserve", "bonifica", "cert"], "Bonificata o non serve"],
  ["nessuna", "Nessuna bonifica",            ["nessuna"],                     "Nessuna bonifica"]
];
const tappaDi = c => TAPPE.find(t => t[2].includes(faseCode(c)))?.[0] || "";
const F = {g:"", t:"", v:"", q:""};   // filtri: gruppo, fase, solo verificati, ricerca
let colore = "fase", listaPronta = false;
try { if (localStorage.getItem("mappa-colore") === "gruppo") colore = "gruppo"; } catch {}
function legenda(){
  const voci = colore === "gruppo"
    ? [["A", `<i class="sw gA"></i>${ELENCO.A.title}`], ["B", `<i class="sw gB"></i>${ELENCO.B.title}`]].map(([g, h]) => [h, PTS.filter(p => p.ok && GRUPPO[p.code] === g).length])
    : TAPPE.map(t => [`<i class="sw f-${t[2][0]}"></i>${esc(t[1])}`, PTS.filter(p => p.ok && tappaDi(p.code) === t[0]).length]);
  const todo = PTS.filter(p => !p.ok).length;
  if (todo) voci.push([`<i class="sw todo"></i>Da verificare`, todo]);
  $("#lg-voci").innerHTML = voci.filter(v => v[1]).map(([h, n]) => `<li>${h}<span class="n">${n}</span></li>`).join("");
}
// i filtri dell'elenco seguono la scelta: le fasi (solo quelle con almeno un'area) o i due gruppi
function filtri(){
  const ch = (k, v, txt, sw = "", tit = "") => `<button type="button" class="chip" data-k="${k}" data-val="${v}"${tit ? ` title="${tit}"` : ""} aria-pressed="${F[k] === v && (k !== "v" || v !== "")}">${sw}${txt}</button>`;
  $("#filters").innerHTML = (colore === "fase"
    ? ch("t", "", "Tutte") + TAPPE.filter(t => PTS.some(p => p.ok && tappaDi(p.code) === t[0])).map(t => ch("t", t[0], esc(t[3]), `<i class="sw f-${t[2][0]}"></i>`, esc(t[1]))).join("")
    : ch("g", "", "Tutti") + ch("g", "A", "Aree di Ilva", `<i class="sw gA"></i>`) + ch("g", "B", "Ricadute", `<i class="sw gB"></i>`))
    + (PTS.every(p => p.ok) ? "" : ch("v", "ok", "✔ Solo verificati"));   // tutti verificati: il filtro non serve
}
function setColore(c, ricorda = true){
  colore = c; F.g = F.t = "";
  document.body.classList.toggle("cf", c === "fase");
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.c === c)));
  $("#lg-modo").textContent = c === "fase" ? "fase" : "gruppo";
  legenda(); filtri();
  if (listaPronta) renderList();
  if (ricorda) try { localStorage.setItem("mappa-colore", c); } catch {}
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setColore(b.dataset.c)));
setColore(colore, false);
// computer: legenda sempre aperta (senza titolo); telefono: chiusa, si apre col tocco
{ const pc = matchMedia("(min-width:900px)"), apri = () => { if (pc.matches) $("#legenda").open = true; }; pc.addEventListener("change", apri); apri(); }

// anteprima di un punto: nome, fin dove è arrivata, barra delle 5 tappe, che posto è e link al report.
// Telefono: cassetto in basso, già aperto a metà (tirato giù si chiude). Computer: riquadro accanto al punto.
function pvHtml(p){
  const s = verified[p.code];
  if (!s) return `<div class="top"><span class="grip" aria-hidden="true"></span><button type="button" class="x" aria-label="Chiudi">✕</button>
    <span class="grp"><b>${p.code}</b>${grpLabel(p.code, true)}</span><span class="nm">${esc(p.name)}</span><span class="fs">Report in arrivo</span></div>`;
  const steps = stepsDi(s, p.code), [, f, sub] = faseDi(s, p.code);
  const posto = senzaNote((s.posto || "").replace(/<[^>]+>/g, ""));
  return `<div class="top">
      <span class="grip" aria-hidden="true"></span>
      <button type="button" class="x" aria-label="Chiudi">✕</button>
      <span class="grp"><b>${p.code}</b>${grpLabel(p.code, true)}</span>
      <span class="nm">${esc(p.name)}</span>
      <span class="fs">${esc(f)}</span>
    </div>
    <div class="more"><div class="in">
      ${sub ? `<p class="sub">${esc(sub)}</p>` : ""}${steps ? barraHtml(steps) + leg5Html() : ""}
      ${verdictDi(s, p.code) ? `<div class="posto"><span class="k">Cosa è stato fatto</span><p>${esc(senzaNote(verdictDi(s, p.code)))}</p></div>` : ""}
      ${posto ? `<div class="posto"><span class="k">Che posto è</span><p>${esc(posto)}</p></div>` : ""}
      <a class="go" href="${reportHref(p.code)}">Leggi il report →</a>
    </div></div>`;
}
// computer: il riquadro sta accanto al punto, dal lato con più spazio
function placePv(){
  if (!pv || pv.hidden || !pvLL || isNarrow()) return;
  const c = map.getSize(), pt = map.latLngToContainerPoint(pvLL), w = pv.offsetWidth, h = pv.offsetHeight, minL = 12 + panelW();
  let left = pt.x + 24 + w <= c.x - 12 ? pt.x + 24 : pt.x - 24 - w;
  left = Math.max(minL, Math.min(left, c.x - w - 12));
  pv.style.left = left + "px"; pv.style.top = Math.max(12, Math.min(pt.y - h/2, c.y - h - 12)) + "px";
}
// telefono: il punto va centrato nello spazio sopra il cassetto; computer: fuori dal pannello dell'elenco
function centra(ll){
  if (isNarrow()) {
    const z = Math.max(map.getZoom(), 14), pt = map.project(ll, z), H = map.getSize().y, avail = H - pv.offsetHeight;
    pt.y += H/2 - avail/2;
    map.setView(map.unproject(pt, z), z);
  } else map.panInside(ll, {paddingTopLeft:[40 + panelW(), 40], paddingBottomRight:[40, 40]});
}
function select(code, opts={}){
  if (!map || !PT[code]) return;
  deselect();
  selected = code;
  const p = PT[code], m = markers[code];
  pvLL = p.ll;
  m?.setZIndexOffset(2000);
  const li = document.querySelector(`.list li[data-code="${code}"]`);
  li?.classList.add("sel");
  // telefono: l'elenco copre la mappa, quindi si chiude e non si scorre (scorrerlo lo riporterebbe in vista)
  if (isNarrow()) { if (panelOpen()) setPanel(false); }
  else if (opts.scroll && li) li.scrollIntoView({block:"nearest", behavior:"smooth"});
  if (isNarrow()) $("#legenda").open = false;
  pv.className = `pv g${GRUPPO[p.code]} f-${faseCode(p.code)}`; pv.innerHTML = pvHtml(p); pv.hidden = false;
  document.body.classList.add("pv-on");
  pinOf(code)?.classList.add("sel");
  centra(p.ll);
  placePv();
  history.replaceState(null, "", "#" + code);
}
function deselect(){
  if (selected){ pinOf(selected)?.classList.remove("sel"); markers[selected]?.setZIndexOffset(PT[selected].ok ? 500 : 0); }
  document.querySelectorAll(".list li.sel").forEach(e => e.classList.remove("sel"));
  if (selected) history.replaceState(null, "", location.pathname);
  selected = null; pvLL = null; if (pv) pv.hidden = true;
  document.body.classList.remove("pv-on");
}

(function initMap(){
  if (!window.L) { $("#map").innerHTML = '<p style="padding:16px">La mappa non si è caricata. Gli interventi sono nell\'elenco.</p>'; return; }
  map = L.map("map", {minZoom:11, maxZoom:16, zoomSnap:.25, maxBounds:TILE_BOUNDS, maxBoundsViscosity:1, zoomControl:false});
  L.control.zoom({position:"topright"}).addTo(map);
  addTiles(map);
  // vista iniziale = tutti i punti (a destra del pannello, sopra il bottone dell'elenco sul telefono), con zoom a quarti
  // per stringerla il più possibile, ma mai così lontana da lasciare zone senza tile;
  // da lì non ci si può allontanare (lo zoom minimo diventa quello della vista iniziale)
  let home = null;
  const fit = () => {
    map.setMinZoom(11); map.setMaxBounds(TILE_BOUNDS);
    map.fitBounds(L.latLngBounds(PTS.map(p => p.ll)), {animate:false, paddingTopLeft:[panelW() + 28, 24], paddingBottomRight:[28, isNarrow() ? 84 : 76]});
    const z = coverZoom(map, map.getZoom());
    map.setMaxBounds(tileBounds(z));
    if (z !== map.getZoom()) map.setZoom(z, {animate:false});
    map.setMinZoom(z);
    home = map.getCenter(); lockMin();
  };
  // allo zoom minimo la mappa sta ferma sulla vista iniziale: niente trascinamento,
  // e se si sposta (frecce della tastiera, zoom indietro con la rotella su un angolo) torna al centro
  const lockMin = () => {
    const atMin = map.getZoom() <= map.getMinZoom();
    map.dragging[atMin ? "disable" : "enable"]();
    if (atMin && home && map.latLngToContainerPoint(home).distanceTo(map.getSize().divideBy(2)) > 3) map.panTo(home, {animate:false});
  };
  map.on("zoomend moveend", lockMin);
  fit();
  let touched = false;
  ["mousedown","touchstart","wheel","keydown"].forEach(ev => $("#map").addEventListener(ev, () => touched = true, {passive:true}));
  if (window.ResizeObserver) new ResizeObserver(() => { map.invalidateSize(); if (!touched) fit(); placePv(); }).observe($("#map"));
  // da lontano (sotto lo zoom 13) i pallini sono punti colorati senza codice, così non si coprono
  const zcls = () => map.getContainer().classList.toggle("zlo", map.getZoom() < 13);
  map.on("zoomend", zcls); zcls();

  PTS.forEach(p => {
    const m = L.marker(p.ll, {icon:pinIcon(p), keyboard:true, title:`${p.code} · ${p.name}`, zIndexOffset: p.official ? 800 : p.ok ? 500 : 0}).addTo(map);
    m.on("click", e => { L.DomEvent.stopPropagation(e); select(p.code, {scroll:true}); });
    m.on("mouseover", () => document.querySelector(`.list li[data-code="${p.code}"]`)?.classList.add("hl"));
    m.on("mouseout", () => document.querySelector(`.list li[data-code="${p.code}"]`)?.classList.remove("hl"));
    markers[p.code] = m;
  });

  pv = document.createElement("div"); pv.className = "pv"; pv.hidden = true;
  pv.setAttribute("role", "region"); pv.setAttribute("aria-label", "Anteprima dell'intervento");
  $(".mapwrap").appendChild(pv);
  pv.addEventListener("click", e => { if (e.target.closest(".x")) deselect(); });
  // cassetto del telefono: segue il dito verso il basso e, tirato giù, si chiude
  let y0 = null, dy = 0;
  pv.addEventListener("pointerdown", e => { if (isNarrow() && e.target.closest(".top") && !e.target.closest("button")) { y0 = e.clientY; dy = 0; pv.setPointerCapture(e.pointerId); } });
  pv.addEventListener("pointermove", e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); pv.style.transform = dy ? `translateY(${dy}px)` : ""; });
  const lascia = () => { if (y0 === null) return; y0 = null; pv.style.transform = ""; if (dy > 60) deselect(); };
  pv.addEventListener("pointerup", lascia); pv.addEventListener("pointercancel", lascia);
  map.on("click", deselect);
  map.on("move zoom", placePv);

  if (window.ResizeObserver) new ResizeObserver(() => placePv()).observe(pv);   // l'altezza cambia quando arrivano i caratteri
  addEventListener("keydown", e => { if (e.key === "Escape") deselect(); });
})();

/* elenco con filtri (F è sopra, con i colori) */
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function matches(p){
  if (F.g && GRUPPO[p.code] !== F.g) return false;
  if (F.t && tappaDi(p.code) !== F.t) return false;
  if (F.v === "ok" && !p.ok) return false;
  if (F.q && !norm(`${p.code} ${p.name} ${ROW[p.code][2]}`).includes(norm(F.q))) return false;
  return true;
}
const itemHtml = p => { const s = verified[p.code];
  return `<li class="g${GRUPPO[p.code]} f-${faseCode(p.code)} ${p.ok?"ok":""}" data-code="${p.code}"><span class="dot">${p.code}</span><span class="nm">${esc(p.name)}</span><span class="vd">${s ? esc(senzaNote(verdictDi(s, p.code))) : "Da verificare"}</span></li>`; };
function renderList(){
  const shown = ORDER.filter(matches), ok = shown.filter(p => p.ok), todo = shown.filter(p => !p.ok);
  let h = "";
  if (ok.length) h += `<li class="sub">Con report · ${ok.length}</li>` + ok.map(itemHtml).join("");
  if (todo.length) h += `<li class="sub">Da verificare · ${todo.length}</li>` + todo.map(itemHtml).join("");
  $("#list").innerHTML = h || `<li class="empty">Nessun intervento corrisponde ai filtri.</li>`;
  $("#lcount").textContent = `${shown.length} interventi mostrati`;
  PTS.forEach(p => pinOf(p.code)?.classList.toggle("off", !matches(p)));
  if (selected && !matches(PT[selected])) deselect();
  else if (selected) document.querySelector(`.list li[data-code="${selected}"]`)?.classList.add("sel");
}
$("#filters").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const k = b.dataset.k, val = b.dataset.val;
  F[k] = (k === "v" && F.v === val) ? "" : val;   // "Solo verificati" si accende e si spegne
  filtri(); renderList();
});
$("#q").addEventListener("input", e => { F.q = e.target.value.trim(); renderList(); });
$("#list").addEventListener("mouseover", e => { const c = e.target.closest("li[data-code]"); if (c) pinOf(c.dataset.code)?.classList.add("hl"); });
$("#list").addEventListener("mouseout", e => { const c = e.target.closest("li[data-code]"); if (c && !c.contains(e.relatedTarget)) pinOf(c.dataset.code)?.classList.remove("hl"); });
$("#list").addEventListener("click", e => {
  const c = e.target.closest("li[data-code]"); if (!c) return;
  if (isNarrow()) setPanel(false);
  setTimeout(() => select(c.dataset.code), isNarrow() ? 230 : 0);
});
listaPronta = true;
renderList();
// mappa.html?g=A (o B) dalla home: si parte colorando per gruppo, con quel gruppo filtrato (senza cambiare la scelta ricordata)
{ const g = new URLSearchParams(location.search).get("g"); if (g === "A" || g === "B") { setColore("gruppo", false); F.g = g; filtri(); renderList(); } }
{
  const lk = r => { const s = verified[r[0]]; return s ? `<a href="${reportHref(r[0])}">${r[0]} ${esc(s.short)}</a>` : r[0]; };
  const dv = ELENCO.B.items.filter(r => DA_VERIFICARE.has(r[0]));
  $("#fuori").innerHTML = `<p>La mappa mostra solo le aree inquinate dall'Ilva. Non ci sono:</p><ul>` +
    `<li>le aree inquinate da altri: raffineria, altre industrie, porto, Marina, distributori di carburante;</li>` +
    `<li>le voci del Commissario che non riguardano l'inquinamento dell'Ilva, per esempio l'ex Cemerad, il relitto del mercato ittico, i rifiuti sul fondale del Mar Piccolo e le opere non ambientali.</li></ul>` +
    (dv.length ? `<p>Ci sono invece, con l'etichetta "Ricaduta da verificare", ${dv.length} aree per cui non abbiamo ancora trovato la fonte che leghi l'inquinamento all'Ilva: ${dv.map(r => verified[r[0]] ? lk(r) : `${r[0]} ${esc(r[1].replace(/\s*\([^)]*\)/g, ""))}`).join(", ")}.</p>` : "");
  const dlg = $("#fuori-dlg");
  $("#fuori-open").addEventListener("click", () => dlg.showModal());
  $("#fuori-close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });   // clic fuori dal riquadro
}

// mappa.html#A10 → pallino già selezionato
const start = decodeURIComponent(location.hash.slice(1)).toUpperCase();
if (PT[start]) setTimeout(() => select(start, {scroll:true}), 60);
</script>
